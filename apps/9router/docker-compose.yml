x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  9router:
    image: decolua/9router:latest
    container_name: zeromail-9router
    restart: unless-stopped
    environment:
      REQUIRE_API_KEY: "true"
      JWT_SECRET: ${ZEROMAIL_9ROUTER_JWT_SECRET:?ZEROMAIL_9ROUTER_JWT_SECRET must be set in apps/9router/.env}
      INITIAL_PASSWORD: ${ZEROMAIL_9ROUTER_INITIAL_PASSWORD:?ZEROMAIL_9ROUTER_INITIAL_PASSWORD must be set in apps/9router/.env}
      AUTH_COOKIE_SECURE: "true"
    ports:
      # Loopback-only — admin UI accessed via SSH tunnel:
      #   ssh -L 20128:127.0.0.1:20128 dat@72.62.193.33
      - "127.0.0.1:20128:8080"
    volumes:
      - 9router_data:/data
    networks:
      # Attach to the existing zeromail backend network so zeromail-api can
      # call http://zeromail-9router:8080/... internally.
      - zeromail-internal
    logging: *default-logging

networks:
  zeromail-internal:
    external: true

volumes:
  9router_data:
