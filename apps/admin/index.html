<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101828'/%3E%3Cpath d='M8 10h16v12H8z' fill='%23FDE8BA'/%3E%3Cpath d='m8 10 8 7 8-7' fill='none' stroke='%23E3A023' stroke-width='2'/%3E%3C/svg%3E"
    />
    <title>Zero Mail Admin</title>
    <script>
      // No-FOUC theme bootstrap. Runs synchronously before any CSS/JS so the
      // first paint matches the stored theme. Mirror key: 'zm-admin-theme'.
      // Falls back to OS preference when no stored value.
      (function () {
        try {
          var stored = localStorage.getItem('zm-admin-theme');
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = resolved;
        } catch (_) {
          // localStorage may throw in private mode — fall back to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
