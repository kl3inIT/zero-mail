<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>Zero Mail Admin</title>
    <script>
      // No-FOUC theme bootstrap. Runs synchronously before any CSS/JS so the
      // first paint matches the stored theme. Mirror key: 'zm-admin-theme'.
      // Falls back to OS preference when no stored value.
      (function () {
        try {
          var stored = localStorage.getItem('zm-admin-theme');
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
          if (resolved === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = resolved;
        } catch (_) {
          // localStorage may throw in private mode — fall back to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
