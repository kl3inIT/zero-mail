[versions]
springBoot = "4.0.6"
springAi = "2.0.0-M6"
# Spring Modulith 2.0.x is the Spring Boot 4-compatible line. Keep this GA pin in
# sync with buildSrc/src/main/kotlin/zeromail.modulith-conventions.gradle.kts.
springModulith = "2.0.6"
liquibase = "5.0.3"
archunit = "1.4.2"
logstashLogback = "9.0"
googleAuthLibrary = "1.47.0"
gmailApi = "v1-rev20250331-2.0.0"
testcontainers = "1.21.3"
springdoc = "3.0.3"
jsoup = "1.22.2"
shedlock = "7.7.0"
jtokkit = "1.1.0"
re2j = "1.8"
jakartaMail = "2.0.5"
jakartaMailApi = "2.1.5"
resend = "4.13.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "springModulith" }
spring-modulith-starter-jdbc = { module = "org.springframework.modulith:spring-modulith-starter-jdbc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstashLogback" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "springAi" }
spring-ai-starter-model-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai", version.ref = "springAi" }
spring-ai-starter-model-anthropic = { module = "org.springframework.ai:spring-ai-starter-model-anthropic", version.ref = "springAi" }
spring-ai-starter-model-google-genai = { module = "org.springframework.ai:spring-ai-starter-model-google-genai", version.ref = "springAi" }
spring-ai-starter-model-deepseek = { module = "org.springframework.ai:spring-ai-starter-model-deepseek", version.ref = "springAi" }
jtokkit = { module = "com.knuddels:jtokkit", version.ref = "jtokkit" }
google-re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }
google-auth-library-oauth2-http = { module = "com.google.auth:google-auth-library-oauth2-http", version.ref = "googleAuthLibrary" }
google-api-services-gmail = { module = "com.google.apis:google-api-services-gmail", version.ref = "gmailApi" }
shedlock-provider-jdbc-template = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }
shedlock-spring = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
angus-mail = { module = "org.eclipse.angus:angus-mail", version.ref = "jakartaMail" }
jakarta-mail-api = { module = "jakarta.mail:jakarta.mail-api", version.ref = "jakartaMailApi" }
resend-java = { module = "com.resend:resend-java", version.ref = "resend" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.7" }
