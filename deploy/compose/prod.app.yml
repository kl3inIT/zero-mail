x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  nginx-proxy-manager:
    image: ${NGINX_PROXY_MANAGER_IMAGE:-jc21/nginx-proxy-manager:latest}
    container_name: zeromail-nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    volumes:
      - /opt/zeromail/npm-data:/data
      - /opt/zeromail/npm-letsencrypt:/etc/letsencrypt
    networks:
      - proxy-network
    logging: *default-logging

  worker:
    build:
      context: ../..
      dockerfile: backend/worker/Dockerfile
    image: ${ZEROMAIL_WORKER_IMAGE:-zeromail-worker:latest}
    container_name: zeromail-worker
    restart: unless-stopped
    env_file: ../../.env
    mem_limit: 1g
    mem_reservation: 700m
    # Keep Java from swapping. Host swap is still recommended as a system safety net.
    memswap_limit: 1g
    networks:
      - zeromail-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging: *default-logging

  frontend:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://zeromail.vn}
    image: ${ZEROMAIL_FRONTEND_IMAGE:-zeromail-frontend:latest}
    container_name: zeromail-frontend
    restart: unless-stopped
    env_file: ../../.env
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *default-logging

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_ADMIN_API_BASE: ${VITE_ADMIN_API_BASE:-https://admin.zeromail.vn}
    image: ${ZEROMAIL_ADMIN_IMAGE:-zeromail-admin:latest}
    container_name: zeromail-admin
    restart: unless-stopped
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5174/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile
    image: ${ZEROMAIL_API_IMAGE:-zeromail-api:latest}
    container_name: zeromail-api
    restart: unless-stopped
    env_file: ../../.env
    mem_limit: 1500m
    mem_reservation: 1g
    # Keep Java from swapping. Host swap is still recommended as a system safety net.
    memswap_limit: 1500m
    networks:
      - proxy-network
      - zeromail-internal
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging: *default-logging

networks:
  proxy-network:
    external: true
  zeromail-internal:
    external: true
