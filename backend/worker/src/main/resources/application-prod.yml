# Production profile: concise structured events only.
# Privacy invariants: prompt/completion logging OFF (also enforced by base application.yml).

logging:
  level:
    root: INFO
    com.zeromail: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

spring:
  ai:
    chat:
      # intentional defense-in-depth: also enforced by base + zero-mail-shared.yml — never drop
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
