# Worker test profile: minimal Spring context for fast, isolated integration tests.
# Tests that need real infrastructure (Postgres, Redis) override via @DynamicPropertySource
# from a Testcontainers base class.

spring:
  main:
    lazy-initialization: true

  docker:
    compose:
      enabled: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        query.plan_cache_max_size: 64
        query.plan_parameter_metadata_max_size: 64

  ai:
    openai:
      api-key: test-openai-key
    anthropic:
      api-key: test-anthropic-key
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client
            client-secret: test-google-secret

zero-mail:
  scheduling:
    enabled: false
  worker:
    gmail:
      pubsub:
        topic-name: projects/test-project/topics/zero-mail-gmail-test
  crypto:
    refresh-token-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    inbox-projection-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    inbox-projection-sender-hash-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  llm:
    platform:
      api-key: test-platform-llm-key
  notification:
    email:
      resend:
        api-key: test-resend-key

logging:
  level:
    com.zeromail: INFO
    org.testcontainers: WARN
    org.springframework.boot.docker.compose: OFF
