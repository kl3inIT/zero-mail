spring:
  application:
    name: zeromail-worker
  config:
    # Correctness-locked Spring-AI privacy/suppression block lives in backend/core
    # (single source of truth, imported by api + worker). Imported values WIN over this file.
    import: optional:classpath:zero-mail-shared.yml
  # GenAI embedding auto-config exclusion lives on @SpringBootApplication(excludeName=...)
  # in ZeroMailWorkerApplication (timing-safe; Boot #26858). Do not re-add a yml exclude block.
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5555/zeromail_dev?sslmode=disable}
    username: ${DB_USER:zeromail_dev}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    # Worker renders no web views; Open Session In View only holds DB connections
    # longer and warns at startup. Disable it (mirrors backend/api).
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    # Email templates use a dedicated ClassLoaderTemplateResolver in
    # DigestRendererConfig, not Spring Boot's default classpath:/templates/.
    # Disable the default-location check to silence its startup WARN.
    check-template-location: false
  ai:
    # spring.ai.model.*=none + chat[.client].observations.log-prompt/completion=false are
    # centralized in zero-mail-shared.yml (imported above). Only worker-specific keys remain here.
    retry:
      max-attempts: 2
zero-mail:
  worker:
    gmail:
      pubsub:
        topic-name: ${GOOGLE_PUBSUB_TOPIC_NAME:?GOOGLE_PUBSUB_TOPIC_NAME env var is required}
  crypto:
    refresh-token-key-base64: ${REFRESH_TOKEN_KEY_BASE64:?REFRESH_TOKEN_KEY_BASE64 must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
  llm:
    platform:
      # provider/base-url/models/timeouts default in LlmProperties; only api-key is deployment-supplied
      api-key: ${ZEROMAIL_LLM_PLATFORM_API_KEY:?ZEROMAIL_LLM_PLATFORM_API_KEY must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
    drift:
      enabled: ${ZEROMAIL_LLM_DRIFT_ENABLED:false}
      fixed-tenant-id: 00000000-0000-0000-0000-000000000000
      threshold-percent: 20
  notification:
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    email:
      from-address: notifications@zeromail.vn
      resend:
        api-key: ${RESEND_API_KEY:?RESEND_API_KEY env var is required}
server:
  port: 8081
management:
  observations:
    enabled: true
  # See backend/api/application.yml: disable the redundant OTLP metrics push (localhost:4318) on
  # every profile; metrics go via Prometheus scrape, traces via OTLP→Alloy in prod.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
