spring:
  application:
    name: zeromail-worker
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zeromail}
    username: ${DB_USER:zeromail}
    password: ${DB_PASSWORD:zeromail}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  ai:
    model:
      # Zero Mail builds provider-specific Spring AI ChatModel instances inside
      # core.llm.gateway.springai so BYOK can vary apiKey/baseUrl/model safely.
      # Disable starter auto-model beans for unused modalities; otherwise M5
      # eagerly creates OpenAI audio/image/embedding clients and requires extra credentials.
      chat: none
      embedding: none
      embedding.text: none
      embedding.multimodal: none
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
    retry:
      max-attempts: 2
zero-mail:
  worker:
    gmail:
      pubsub:
        topic-name: ${GOOGLE_PUBSUB_TOPIC_NAME:?GOOGLE_PUBSUB_TOPIC_NAME env var is required}
  crypto:
    refresh-token-key-base64: ${REFRESH_TOKEN_KEY_BASE64:?REFRESH_TOKEN_KEY_BASE64 must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
  billing:
    sepay:
      # Bare placeholder: Spring fails during placeholder resolution when the secret is absent.
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY}
    payment-account:
      bank-code: ${ZEROMAIL_BILLING_BANK_CODE:?ZEROMAIL_BILLING_BANK_CODE must be supplied via env file or deployment secret source}
      bank-name: ${ZEROMAIL_BILLING_BANK_NAME:?ZEROMAIL_BILLING_BANK_NAME must be supplied via env file or deployment secret source}
      account-number: ${ZEROMAIL_BILLING_ACCOUNT_NUMBER:?ZEROMAIL_BILLING_ACCOUNT_NUMBER must be supplied via env file or deployment secret source}
      account-name: ${ZEROMAIL_BILLING_ACCOUNT_NAME:?ZEROMAIL_BILLING_ACCOUNT_NAME must be supplied via env file or deployment secret source}
      qr-payload: ${ZEROMAIL_BILLING_QR_PAYLOAD:}
    vnd-per-credit: 1000
    max-pending-intents-per-tenant: 5
    intent-expiry: PT24H
  llm:
    platform:
      provider: openai
      base-url: https://openrouter.ai/api/v1
      api-key: ${ZEROMAIL_LLM_PLATFORM_API_KEY:?ZEROMAIL_LLM_PLATFORM_API_KEY must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
      compile-model: openai/gpt-5.4-nano
      drift-model: openai/gpt-5.4-nano
      triage-model: openai/gpt-5.4-nano
      connect-timeout: 5s
      read-timeout: 30s
    drift:
      enabled: ${ZEROMAIL_LLM_DRIFT_ENABLED:false}
      fixed-tenant-id: 00000000-0000-0000-0000-000000000000
      threshold-percent: 20
  notification:
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    email:
      from-address: notifications@zero-mail.app
      resend:
        api-key: ${RESEND_API_KEY:?RESEND_API_KEY env var is required}
server:
  port: 8081
management:
  observations:
    enabled: true
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health
