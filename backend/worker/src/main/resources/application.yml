spring:
  application:
    name: zeromail-worker
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zeromail}
    username: ${DB_USER:zeromail}
    password: ${DB_PASSWORD:zeromail}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  ai:
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
zero-mail:
  crypto:
    refresh-token-key-base64: ${REFRESH_TOKEN_KEY_BASE64:?REFRESH_TOKEN_KEY_BASE64 must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
  gmail:
    pubsub:
      topic-name: ${GOOGLE_PUBSUB_TOPIC_NAME:?GOOGLE_PUBSUB_TOPIC_NAME env var is required}
  billing:
    sepay:
      # Bare placeholder: Spring fails during placeholder resolution when the secret is absent.
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY}
    vnd-per-credit: 1000
    max-pending-intents-per-tenant: 5
    intent-expiry: PT24H
  llm:
    platform:
      provider: openai-compatible
      base-url: https://openrouter.ai/api/v1
      api-key: ${ZEROMAIL_LLM_PLATFORM_API_KEY:?ZEROMAIL_LLM_PLATFORM_API_KEY must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
      compile-model: openai/gpt-4o-mini
      drift-model: openai/gpt-4o-mini
      triage-model: openai/gpt-4o-mini
      connect-timeout: 5s
      read-timeout: 30s
    byok:
      allow-non-vendor-endpoints: false
      allowed-extra-hosts: []
      connect-timeout: 5s
      read-timeout: 15s
    drift:
      enabled: ${ZEROMAIL_LLM_DRIFT_ENABLED:false}
      fixed-tenant-id: 00000000-0000-0000-0000-000000000000
      threshold-percent: 20
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health
