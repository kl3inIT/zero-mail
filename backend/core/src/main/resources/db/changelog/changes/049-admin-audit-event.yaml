databaseChangeLog:
  - changeSet:
      id: 049-admin-audit-event
      author: zeromail
      comment: >
        Append-only admin mutation audit table with deterministic chain_index ordering and
        application-supplied canonical_timestamp_ms for HMAC chain re-derivation.
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE TABLE admin_audit_event (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                chain_index bigserial NOT NULL UNIQUE,
                actor_user_id uuid NOT NULL REFERENCES admin_users(id),
                actor_email varchar(320) NOT NULL,
                action varchar(64) NOT NULL,
                target_kind varchar(32),
                target_id uuid,
                before_state_json jsonb,
                after_state_json jsonb,
                reason varchar(500),
                request_ip inet,
                request_id uuid,
                canonical_timestamp_ms bigint NOT NULL,
                created_at timestamptz NOT NULL DEFAULT now(),
                hmac_chain_hash bytea NOT NULL,
                CONSTRAINT ck_admin_audit_event_hmac_length CHECK (octet_length(hmac_chain_hash) = 32)
              );

              CREATE INDEX idx_admin_audit_event_actor_created ON admin_audit_event (actor_user_id, created_at DESC);
              CREATE INDEX idx_admin_audit_event_action_created ON admin_audit_event (action, created_at DESC);
              CREATE INDEX idx_admin_audit_event_target_created ON admin_audit_event (target_kind, target_id, created_at DESC);

              CREATE OR REPLACE FUNCTION reject_admin_audit_event_mutation()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              BEGIN
                RAISE EXCEPTION 'admin_audit_event is append-only'
                  USING ERRCODE = '23514';
              END;
              $$;

              CREATE TRIGGER admin_audit_event_append_only
              BEFORE UPDATE OR DELETE ON admin_audit_event
              FOR EACH ROW
              EXECUTE FUNCTION reject_admin_audit_event_mutation();

              DO $$
              BEGIN
                IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'zeromail_app') THEN
                  REVOKE UPDATE, DELETE ON admin_audit_event FROM zeromail_app;
                  GRANT INSERT, SELECT ON admin_audit_event TO zeromail_app;
                  GRANT USAGE, SELECT ON SEQUENCE admin_audit_event_chain_index_seq TO zeromail_app;
                END IF;
              END;
              $$;
      rollback:
        - sql:
            splitStatements: false
            sql: |
              DROP TRIGGER IF EXISTS admin_audit_event_append_only ON admin_audit_event;
              DROP FUNCTION IF EXISTS reject_admin_audit_event_mutation();
              DROP TABLE IF EXISTS admin_audit_event;
