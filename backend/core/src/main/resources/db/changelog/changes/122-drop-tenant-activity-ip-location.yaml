databaseChangeLog:
  - changeSet:
      id: 122-drop-tenant-activity-ip-location
      author: zeromail
      comment: >
        Remove IP and location audit fields from tenant activity events. Product no longer
        requires IP/location auditing in the admin customer activity surface.
      preConditions:
        - onFail: MARK_RAN
        - or:
            - columnExists:
                tableName: tenant_activity_event
                columnName: ip_address
            - columnExists:
                tableName: tenant_activity_event
                columnName: location_label
      changes:
        - dropColumn:
            tableName: tenant_activity_event
            columns:
              - column:
                  name: ip_address
              - column:
                  name: location_label
      rollback:
        - addColumn:
            tableName: tenant_activity_event
            columns:
              - column:
                  name: ip_address
                  type: inet
              - column:
                  name: location_label
                  type: varchar(160)
