databaseChangeLog:
  - changeSet:
      id: 042-processing-job
      author: zeromail
      comment: >
        Generic Postgres-backed worker outbox (D-01) for user-triggered async jobs.
        Phase 8 ships UNSUBSCRIBE_CAMPAIGN; SEED-009 reuses this table with new job_type
        enum values via a follow-up migration. SKIP LOCKED pickup + heartbeat-based crash
        recovery via reaper batch (D-03). payload is jsonb holding compact references such
        as `{"campaignId": "uuid", "schemaVersion": 1}` (D-19) — never raw email content
        or LLM material (CLAUDE.md privacy). Purge of completed/failed rows after 90d via
        partial index on finished_at (D-25); campaign + attempt rows are kept indefinitely.
      changes:
        - createTable:
            tableName: processing_job
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_processing_job_tenant
                    references: tenants(id)
                    deleteCascade: true
              - column:
                  name: job_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(16)
                  defaultValue: QUEUED
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_run_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: heartbeat_at
                  type: timestamptz
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: timestamptz
              - column:
                  name: finished_at
                  type: timestamptz
              - column:
                  name: failure_reason
                  type: varchar(255)
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            comment: Status enum matches ProcessingJobStatus ids (D-01).
            sql: ALTER TABLE processing_job ADD CONSTRAINT ck_processing_job_status CHECK (status IN ('QUEUED','RUNNING','COMPLETED','FAILED'))
        - sql:
            comment: job_type enum is closed; SEED-009 will extend via dedicated migration.
            sql: ALTER TABLE processing_job ADD CONSTRAINT ck_processing_job_job_type CHECK (job_type IN ('UNSUBSCRIBE_CAMPAIGN'))
        - createIndex:
            tableName: processing_job
            indexName: idx_processing_job_pickup
            columns:
              - column:
                  name: status
              - column:
                  name: next_run_at
              - column:
                  name: created_at
        - sql:
            comment: Partial index for reaper crash-recovery scan (D-03).
            sql: CREATE INDEX idx_processing_job_running_heartbeat ON processing_job (heartbeat_at) WHERE status = 'RUNNING'
        - createIndex:
            tableName: processing_job
            indexName: idx_processing_job_tenant_type
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: job_type
        - sql:
            comment: Partial index supports purge batch for completed/failed jobs older than 90d (D-25).
            sql: CREATE INDEX idx_processing_job_finished_at ON processing_job (finished_at) WHERE status IN ('COMPLETED','FAILED')
      rollback:
        - dropTable:
            tableName: processing_job
