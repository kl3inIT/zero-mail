# 079-llm-call-audit-credential-source.yaml
#
# Phase 08 Plan 8F (Spend Dashboard) — creates `llm_call_audit` metadata-only audit
# table for OPS-SPEND-01/02 + ARCH-11 sentinel-leak gate.
#
# Reviews-pass R-8F-H1: row-level `credential_source` column (PLATFORM | BYOK | UNKNOWN)
# is the source of truth for platform-vs-BYOK split on the /admin/spend dashboard. A
# tenant-level join (via byok_credential) would incorrectly classify rows when a tenant
# has mixed BYOK + platform usage per feature.
#
# Reviews-pass R-8F-H9 (cycle-3): `credential_source` is `NOT NULL DEFAULT 'UNKNOWN'`
# and CHECK accepts PLATFORM | BYOK | UNKNOWN. Historical rows surface as UNKNOWN; the
# UI renders a third "Unknown" bar segment with a caveat caption. Write-path code MUST
# set PLATFORM or BYOK at insert time (gated by LlmCallAuditCredentialSourceCoverageTest
# ArchUnit rule); UNKNOWN is reserved for the default/backfill literal.
#
# Privacy contract (OPS-SPEND-02 + ARCH-11): this table NEVER carries prompt text,
# completion text, request body, or response body columns. AdminSpendPromptAccessorBanTest
# ArchUnit gate forbids spend code from reading any accessor named getPrompt* /
# getCompletion* / getRequest* / getResponse* / getBody* / getContent*. The DTO contract
# AND the schema are the privacy gate.
#
# Ownership matrix: this changeset lives in the 079 band reserved for 8F per the
# admin-shared-file-ownership matrix carried forward from 8A R-H10.

databaseChangeLog:
  - changeSet:
      id: 079-llm-call-audit-credential-source
      author: zeromail
      changes:
        - createTable:
            tableName: llm_call_audit
            remarks: >-
              Metadata-only audit row for LLM calls. NEVER carries prompt or completion
              text. Written by LLM gateway code on every call site. Read-side aggregated
              by SpendAggregateQueryService for /admin/spend dashboard.
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  remarks: >-
                    Nullable FK. NULL when the originating tenant has been deleted
                    (cascade SET NULL). K-anonymity rollup collapses NULL rows.
                  constraints:
                    nullable: true
                    foreignKeyName: fk_llm_call_audit_tenant
                    references: tenants(id)
                    deleteCascade: false
              - column:
                  name: provider
                  type: varchar(32)
                  remarks: Enum name of LlmProvider (OPENAI, ANTHROPIC, GOOGLE, DEEPSEEK, OPENROUTER, ROUTER_9R).
                  constraints:
                    nullable: false
              - column:
                  name: feature
                  type: varchar(16)
                  remarks: Enum name of Feature (CHAT, TRIAGE, DRAFT).
                  constraints:
                    nullable: false
              - column:
                  name: model_id
                  type: varchar(128)
                  remarks: Provider-qualified model identifier (no provider-specific metadata leak).
                  constraints:
                    nullable: false
              - column:
                  name: credential_source
                  type: varchar(16)
                  remarks: PLATFORM | BYOK | UNKNOWN. Row-level classification per R-8F-H1.
                  defaultValue: UNKNOWN
                  constraints:
                    nullable: false
              - column:
                  name: prompt_tokens
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: completion_tokens
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_cost_usd
                  type: numeric(12, 6)
                  remarks: Estimated cost in USD (6-decimal precision). Aggregated by SpendAggregateQueryService.
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - sql:
            comment: CHECK constraint for credential_source (R-8F-H1 + R-8F-H9 — three values, UNKNOWN reserved for backfill default).
            sql: >-
              ALTER TABLE llm_call_audit
              ADD CONSTRAINT ck_llm_call_audit_credential_source
              CHECK (credential_source IN ('PLATFORM', 'BYOK', 'UNKNOWN'))
        - createIndex:
            tableName: llm_call_audit
            indexName: idx_llm_call_audit_created_at
            columns:
              - column:
                  name: created_at
        - createIndex:
            tableName: llm_call_audit
            indexName: idx_llm_call_audit_tenant_created
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: created_at
        - createIndex:
            tableName: llm_call_audit
            indexName: idx_llm_call_audit_provider_created
            columns:
              - column:
                  name: provider
              - column:
                  name: created_at
        - createIndex:
            tableName: llm_call_audit
            indexName: idx_llm_call_audit_feature_created
            columns:
              - column:
                  name: feature
              - column:
                  name: created_at
        - sql:
            comment: BRIN index on created_at for append-only time-ordered range scans (90d aggregates).
            sql: CREATE INDEX idx_llm_call_audit_created_brin ON llm_call_audit USING BRIN (created_at)
      rollback:
        - dropTable:
            tableName: llm_call_audit
