databaseChangeLog:
  - changeSet:
      id: 009-drop-signed-in-onboarding-step
      author: zeromail
      comment: >-
        Phase 01.5 D-B1 — OnboardingStep.SIGNED_IN dropped from the enum.
        After collapse, login + Gmail connection happen atomically. Update any
        pre-launch dev rows still on SIGNED_IN to GMAIL_CONNECTED so Hibernate
        string-mapping does not throw at boot. Idempotent: 0 rows when no
        SIGNED_IN values remain.
      changes:
        - update:
            tableName: users
            columns:
              - column:
                  name: onboarding_step
                  value: GMAIL_CONNECTED
            where: "onboarding_step = 'SIGNED_IN'"
      rollback:
        - empty
