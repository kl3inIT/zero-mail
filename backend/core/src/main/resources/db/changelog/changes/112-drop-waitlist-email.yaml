databaseChangeLog:
  - changeSet:
      id: 112-drop-waitlist-email
      author: zeromail
      comment: >-
        Remove the pre-launch waitlist feature now that the product is publicly
        available. Drops waitlist_email (created in 086, extended in 087) and its
        indexes/unique constraint. The roll-forward is intentional: signup now goes
        straight through Google OAuth, so the waitlist table, its admin console, and
        the worker invite-dispatch scheduler are all retired. Rollback recreates the
        table structure (data is not recoverable).
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: waitlist_email
      changes:
        - dropTable:
            tableName: waitlist_email
      rollback:
        - createTable:
            tableName: waitlist_email
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(320), constraints: { nullable: false } }
              - column: { name: status, type: varchar(32), constraints: { nullable: false }, defaultValue: "PENDING" }
              - column: { name: source, type: varchar(64) }
              - column: { name: ip_hash, type: varchar(64) }
              - column: { name: user_agent, type: varchar(512) }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false }, defaultValueComputed: now() }
              - column: { name: approved_at, type: timestamptz }
              - column: { name: approved_by_admin_id, type: uuid }
              - column: { name: invite_sent_at, type: timestamptz }
              - column: { name: invite_next_attempt_at, type: timestamptz }
              - column: { name: invite_failure_reason, type: varchar(128) }
        - addUniqueConstraint:
            tableName: waitlist_email
            columnNames: email
            constraintName: uq_waitlist_email_email
        - createIndex:
            indexName: idx_waitlist_email_status_created_at
            tableName: waitlist_email
            columns:
              - column: { name: status }
              - column: { name: created_at, descending: true }
        - createIndex:
            indexName: idx_waitlist_email_invite_due
            tableName: waitlist_email
            columns:
              - column: { name: status }
              - column: { name: invite_next_attempt_at }
