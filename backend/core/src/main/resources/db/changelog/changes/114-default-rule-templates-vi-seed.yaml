                  'Email chào hàng',
                  'Gắn nhãn "Email chào hàng" cho email chào mời không mời mà đến và lưu trữ chúng.',
                  'vi',
                  'rules.v1',
                  '{"schemaVersion":"rules.v1","type":"SEMANTIC_INTENT","nodeId":"system-cold-email-vi","intent":"Email chào hàng: chào bán, tuyển dụng, hoặc đề nghị hợp tác không mời mà đến từ người chưa có quan hệ trước. KHÔNG phải chào hàng: nhà đầu tư, bạn bè, đồng nghiệp, email giới thiệu, khách hàng hiện tại, bản tin, hóa đơn, khuyến mãi, cảnh báo, cập nhật, lời mời lịch, đặt lại mật khẩu, hoặc email chào mừng.","deferred":true}'::jsonb,
                  '[{"type":"label","labelName":"Email chào hàng"},{"type":"archive"}]'::jsonb,
                  'materializable'
                )
              ON CONFLICT (template_key, template_version) DO NOTHING
      rollback:
        - sql:
            sql: >-
              DELETE FROM rule_template_catalog WHERE template_key IN (
                'system-to-reply-vi','system-awaiting-reply-vi','system-fyi-vi','system-actioned-vi',
                'system-newsletter-vi','system-marketing-vi','system-calendar-vi','system-receipt-vi',
                'system-notification-vi','system-cold-email-vi')
