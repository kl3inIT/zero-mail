databaseChangeLog:
  - changeSet:
      id: 114-default-rule-templates-vi-seed
      author: zeromail
      changes:
        - sql:
            splitStatements: false
            comment: >-
              Vietnamese variants of the default rule templates seeded in 113. First-login seeding
              picks the `-vi` keys for Vietnamese users and the base (English) keys for English
              users, based on the Google OIDC locale claim. displayName, intent (the LLM
              classification instruction), AND labelName (the real Gmail label the user sees) are
              all localized. Distinct nodeId per template (the `-vi` key) — same reason as 113: the
              triage parser falls back to a shared "matcher" nodeId, which would collapse the ten
              semantic requests into one LLM result. Marketing + Cold Email archive; To Reply also
              drafts a reply.
            sql: |
              INSERT INTO rule_template_catalog (
                id, template_key, template_version, display_name, source_text, source_language,
                schema_version, matcher_ast, action_intents, status
              )
              VALUES
                (
                  '00000000-0000-0000-0000-000000003201'::uuid,
                  'system-to-reply-vi',
                  1,
                  'Cần trả lời',
                  'Gắn nhãn "Cần trả lời" cho email tôi cần đích thân phản hồi và soạn sẵn câu trả lời để tôi xem lại.',
                  'vi',
                  'rules.v1',
                  '{"schemaVersion":"rules.v1","type":"SEMANTIC_INTENT","nodeId":"system-to-reply-vi","intent":"Email tôi cần đích thân trả lời — câu hỏi trực tiếp, yêu cầu, hoặc tin nhắn đang chờ tôi phản hồi.","deferred":true}'::jsonb,
                  '[{"type":"label","labelName":"Cần trả lời"},{"type":"save_draft","instruction":"Soạn một câu trả lời ngắn gọn, chuyên nghiệp để tôi xem lại trước khi gửi."}]'::jsonb,
                  'materializable'
                ),
                (
                  '00000000-0000-0000-0000-000000003202'::uuid,
                  'system-awaiting-reply-vi',
                  1,
                  'Chờ phản hồi',
                  'Gắn nhãn "Chờ phản hồi" cho email tôi đang chờ người khác trả lời.',
                  'vi',
                  'rules.v1',
                  '{"schemaVersion":"rules.v1","type":"SEMANTIC_INTENT","nodeId":"system-awaiting-reply-vi","intent":"Email mà tôi đang chờ người khác phản hồi sau khi tôi đã trả lời hoặc liên hệ trước.","deferred":true}'::jsonb,
                  '[{"type":"label","labelName":"Chờ phản hồi"}]'::jsonb,
                  'materializable'
                ),
                (
                  '00000000-0000-0000-0000-000000003203'::uuid,
                  'system-fyi-vi',
                  1,
                  'Để biết',
                  'Gắn nhãn "Để biết" cho email quan trọng nhưng không cần trả lời.',
                  'vi',
                  'rules.v1',
                  '{"schemaVersion":"rules.v1","type":"SEMANTIC_INTENT","nodeId":"system-fyi-vi","intent":"Email quan trọng tôi nên biết nhưng không cần trả lời.","deferred":true}'::jsonb,
                  '[{"type":"label","labelName":"Để biết"}]'::jsonb,
                  'materializable'
                ),
