                  '{"schemaVersion":"rules.v1","type":"SEMANTIC_INTENT","nodeId":"system-notification-vi","intent":"Thông báo: cảnh báo tự động, cập nhật trạng thái, hoặc tin nhắn hệ thống từ ứng dụng và dịch vụ.","deferred":true}'::jsonb,
