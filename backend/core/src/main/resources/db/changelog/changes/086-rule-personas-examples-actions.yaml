                  ('other', 140, 'inbox-zero:other:014', $$If people ask me to speak at an event, label the email @[Speaker Opportunity] and archive it$$, $$Nếu có người mời tôi phát biểu tại sự kiện, gắn nhãn email là @[Speaker Opportunity] và lưu trữ nó$$),
                  ('other', 150, 'inbox-zero:other:015', $$Label emails from customers as @[Customer]$$, $$Gắn nhãn email từ khách hàng là @[Customer]$$),
                  ('other', 160, 'inbox-zero:other:016', $$Label legal documents as @[Legal]$$, $$Gắn nhãn tài liệu pháp lý là @[Legal]$$),
                  ('other', 170, 'inbox-zero:other:017', $$Label server errors as @[Error]$$, $$Gắn nhãn lỗi server là @[Error]$$),
                  ('other', 180, 'inbox-zero:other:018', $$Label Stripe emails as @[Stripe]$$, $$Gắn nhãn email Stripe là @[Stripe]$$)
              )
              INSERT INTO rule_example_prompt(persona_id, prompt_en, prompt_vi, display_order, enabled, source_ref)
              SELECT persona.persona_id, prompt_seed.prompt_en, prompt_seed.prompt_vi, prompt_seed.display_order, TRUE, prompt_seed.source_ref
              FROM prompt_seed
              JOIN rule_example_persona persona ON persona.persona_key = prompt_seed.persona_key
              ON CONFLICT (persona_id, source_ref) DO NOTHING;
      rollback:
        - sql:
            splitStatements: true
            sql: |
              DELETE FROM rule_example_prompt WHERE source_ref LIKE 'inbox-zero:%';
              DELETE FROM rule_action_descriptor WHERE action_key IN ('label','archive','save_draft','mark_read','star','add_to_digest','mark_spam','send_reply','forward_email','send_email');
              DELETE FROM rule_example_persona WHERE persona_key IN ('founder','influencer','realtor','investor','assistant','developer','designer','sales','marketer','support','recruiter','student','outreach','other');
