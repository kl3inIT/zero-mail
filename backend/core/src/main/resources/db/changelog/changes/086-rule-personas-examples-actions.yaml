databaseChangeLog:
  - changeSet:
      id: 086-01-rule-catalog-tables
      author: zeromail
      comment: >
        DB-backed bilingual rule examples/personas, action descriptors, and the global
        auto-send rules setting used by Phase 08.1.
      changes:
        - createTable:
            tableName: rule_example_persona
            columns:
              - column:
                  name: persona_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: persona_key
                  type: varchar(32)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_rule_example_persona_key
              - column:
                  name: display_name_en
                  type: varchar(96)
                  constraints:
                    nullable: false
              - column:
                  name: display_name_vi
                  type: varchar(96)
                  constraints:
                    nullable: false
              - column:
                  name: icon
                  type: varchar(64)
              - column:
                  name: display_order
                  type: int
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_rule_example_persona_order
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createTable:
            tableName: rule_example_prompt
            columns:
              - column:
                  name: prompt_id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: persona_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rule_example_prompt_persona
                    references: rule_example_persona(persona_id)
                    deleteCascade: true
              - column:
                  name: prompt_en
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: prompt_vi
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: source_ref
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: rule_example_prompt
            columnNames: persona_id, display_order
            constraintName: ux_rule_example_prompt_persona_order
        - addUniqueConstraint:
            tableName: rule_example_prompt
            columnNames: persona_id, source_ref
            constraintName: ux_rule_example_prompt_persona_source
        - createTable:
            tableName: rule_action_descriptor
            columns:
              - column:
                  name: action_key
                  type: varchar(48)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: label_en
                  type: varchar(96)
                  constraints:
                    nullable: false
              - column:
                  name: label_vi
                  type: varchar(96)
                  constraints:
                    nullable: false
              - column:
                  name: description_en
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description_vi
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: risk_level
                  type: varchar(16)
                  constraints:
                    nullable: false
              - column:
                  name: availability_status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: int
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_rule_action_descriptor_order
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createTable:
            tableName: rule_automation_settings
            columns:
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_rule_automation_settings_tenant
                    references: tenants(id)
                    deleteCascade: true
              - column:
                  name: auto_send_rules_enabled
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: rule_automation_settings
        - dropTable:
            tableName: rule_action_descriptor
        - dropTable:
            tableName: rule_example_prompt
        - dropTable:
            tableName: rule_example_persona

  - changeSet:
      id: 086-02-rule-catalog-seed
      author: zeromail
      comment: >
        Seed Inbox Zero-style personas, bilingual prompts, and action descriptors. English prompt
        text is copied from the Phase 08.1 Inbox Zero reference artifact; Vietnamese text is seeded
        now so the catalog is useful before admin editing.
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              INSERT INTO rule_example_persona(persona_key, display_name_en, display_name_vi, icon, display_order, enabled)
              VALUES
                ('founder', 'Founder', 'Nhà sáng lập', 'rocket', 10, TRUE),
                ('influencer', 'Influencer', 'Người ảnh hưởng', 'camera', 20, TRUE),
                ('realtor', 'Realtor', 'Môi giới bất động sản', 'home', 30, TRUE),
                ('investor', 'Investor', 'Nhà đầu tư', 'money', 40, TRUE),
                ('assistant', 'Assistant', 'Trợ lý', 'clipboard', 50, TRUE),
                ('developer', 'Developer', 'Lập trình viên', 'code', 60, TRUE),
                ('designer', 'Designer', 'Nhà thiết kế', 'palette', 70, TRUE),
                ('sales', 'Sales', 'Bán hàng', 'handshake', 80, TRUE),
                ('marketer', 'Marketer', 'Marketing', 'megaphone', 90, TRUE),
                ('support', 'Support', 'Hỗ trợ khách hàng', 'support', 100, TRUE),
                ('recruiter', 'Recruiter', 'Tuyển dụng', 'users', 110, TRUE),
                ('student', 'Student', 'Sinh viên', 'graduation-cap', 120, TRUE),
                ('outreach', 'Outreach', 'Tiếp cận', 'message-circle', 130, TRUE),
                ('other', 'Other', 'Khác', 'bot', 140, TRUE)
              ON CONFLICT (persona_key) DO NOTHING;

              INSERT INTO rule_action_descriptor(action_key, label_en, label_vi, description_en, description_vi, risk_level, availability_status, display_order, enabled)
              VALUES
                ('label', 'Label', 'Gắn nhãn', 'Apply a Gmail label when the rule matches.', 'Gắn nhãn Gmail khi rule khớp.', 'LOW', 'AVAILABLE', 10, TRUE),
                ('archive', 'Archive', 'Lưu trữ', 'Remove the message from the inbox without deleting it.', 'Bỏ thư khỏi inbox nhưng không xóa.', 'LOW', 'AVAILABLE', 20, TRUE),
                ('save_draft', 'Save draft', 'Lưu bản nháp', 'Create a Gmail draft for user review.', 'Tạo bản nháp Gmail để người dùng xem lại.', 'LOW', 'AVAILABLE', 30, TRUE),
                ('mark_read', 'Mark read', 'Đánh dấu đã đọc', 'Mark matching messages as read.', 'Đánh dấu thư khớp rule là đã đọc.', 'LOW', 'AVAILABLE', 40, TRUE),
                ('star', 'Star', 'Gắn sao', 'Star matching messages.', 'Gắn sao cho thư khớp rule.', 'LOW', 'AVAILABLE', 50, TRUE),
                ('add_to_digest', 'Add to digest', 'Đưa vào digest', 'Include matching messages in a digest instead of interrupting immediately.', 'Đưa thư khớp rule vào digest thay vì làm phiền ngay.', 'LOW', 'AVAILABLE', 60, TRUE),
                ('mark_spam', 'Mark spam', 'Đánh dấu spam', 'Move matching messages to spam.', 'Chuyển thư khớp rule vào spam.', 'MEDIUM', 'AVAILABLE', 70, TRUE),
                ('send_reply', 'Send reply', 'Gửi trả lời', 'Automatically send a reply when outbound safety gates pass.', 'Tự động gửi trả lời khi các cổng an toàn outbound đều pass.', 'HIGH', 'AVAILABLE', 80, TRUE),
                ('forward_email', 'Forward email', 'Chuyển tiếp email', 'Automatically forward an email when outbound safety gates pass.', 'Tự động chuyển tiếp email khi các cổng an toàn outbound đều pass.', 'HIGH', 'AVAILABLE', 90, TRUE),
                ('send_email', 'Send email', 'Gửi email mới', 'Automatically send a new email when outbound safety gates pass.', 'Tự động gửi email mới khi các cổng an toàn outbound đều pass.', 'HIGH', 'AVAILABLE', 100, TRUE)
              ON CONFLICT (action_key) DO NOTHING;

              WITH prompt_seed(persona_key, display_order, source_ref, prompt_en, prompt_vi) AS (
                VALUES
                  ('founder', 10, 'inbox-zero:founder:001', $$Label emails from @mycompany.com addresses as @[Team]$$, $$Gắn nhãn email từ địa chỉ @mycompany.com là @[Team]$$),
                  ('founder', 20, 'inbox-zero:founder:002', $$Label urgent emails as @[Urgent]$$, $$Gắn nhãn email khẩn cấp là @[Urgent]$$),
                  ('founder', 30, 'inbox-zero:founder:003', $$If someone asks to set up a call, draft a reply with my calendar link: https://cal.com/example$$, $$Nếu ai đó muốn đặt lịch gọi, tạo bản nháp trả lời kèm link lịch của tôi: https://cal.com/example$$),
                  ('founder', 40, 'inbox-zero:founder:004', $$Label emails with feedback from customers about our product as @[Customer Feedback]$$, $$Gắn nhãn email có phản hồi của khách hàng về sản phẩm là @[Customer Feedback]$$),
                  ('founder', 50, 'inbox-zero:founder:005', $$Label emails from customers who need our help and support as @[Customer Support]$$, $$Gắn nhãn email từ khách hàng cần trợ giúp và hỗ trợ là @[Customer Support]$$),
                  ('founder', 60, 'inbox-zero:founder:006', $$Label emails from investors as @[Investor]$$, $$Gắn nhãn email từ nhà đầu tư là @[Investor]$$),
                  ('founder', 70, 'inbox-zero:founder:007', $$Label legal documents as @[Legal]$$, $$Gắn nhãn tài liệu pháp lý là @[Legal]$$),
                  ('founder', 80, 'inbox-zero:founder:008', $$Label emails about travel as @[Travel]$$, $$Gắn nhãn email về đi lại là @[Travel]$$),
                  ('founder', 90, 'inbox-zero:founder:009', $$Label recruitment related emails as @[Hiring]$$, $$Gắn nhãn email liên quan tuyển dụng là @[Hiring]$$),

                  ('influencer', 10, 'inbox-zero:influencer:001', $$Label emails from @mycompany.com addresses as @[Team]$$, $$Gắn nhãn email từ địa chỉ @mycompany.com là @[Team]$$),
                  ('influencer', 20, 'inbox-zero:influencer:002', $$Label urgent emails as @[Urgent]$$, $$Gắn nhãn email khẩn cấp là @[Urgent]$$),
                  ('influencer', 30, 'inbox-zero:influencer:003', $$Label sponsorship inquiries as @[Sponsorship] and draft a reply as follows:
              > Hey NAME,
              >
              > I've attached my media kit and pricing$$, $$Gắn nhãn yêu cầu tài trợ là @[Sponsorship] và tạo bản nháp trả lời như sau:
              > Chào NAME,
              >
              > Tôi đã đính kèm media kit và bảng giá của mình$$),
                  ('influencer', 40, 'inbox-zero:influencer:004', $$Label emails about affiliate programs as @[Affiliate] and archive them$$, $$Gắn nhãn email về chương trình affiliate là @[Affiliate] và lưu trữ chúng$$),
                  ('influencer', 50, 'inbox-zero:influencer:005', $$Label collaboration requests as @[Collab] and draft a reply asking about their audience size and engagement rates$$, $$Gắn nhãn yêu cầu hợp tác là @[Collab] và tạo bản nháp hỏi về quy mô khán giả cùng tỷ lệ tương tác$$),
                  ('influencer', 60, 'inbox-zero:influencer:006', $$Label brand partnership emails as @[Brand Deal] and forward to manager@example.com$$, $$Gắn nhãn email hợp tác thương hiệu là @[Brand Deal] và chuyển tiếp tới manager@example.com$$),
                  ('influencer', 70, 'inbox-zero:influencer:007', $$Label media inquiries to us as @[Press] and draft a polite reply$$, $$Gắn nhãn yêu cầu truyền thông gửi tới chúng tôi là @[Press] và tạo bản nháp trả lời lịch sự$$),

                  ('realtor', 10, 'inbox-zero:realtor:001', $$Label emails from @mycompany.com addresses as @[Team]$$, $$Gắn nhãn email từ địa chỉ @mycompany.com là @[Team]$$),
                  ('realtor', 20, 'inbox-zero:realtor:002', $$Label urgent emails as @[Urgent]$$, $$Gắn nhãn email khẩn cấp là @[Urgent]$$),
                  ('realtor', 30, 'inbox-zero:realtor:003', $$Label emails from potential buyers as @[Buyer Lead] and draft a reply asking about their budget and preferred neighborhoods$$, $$Gắn nhãn email từ người mua tiềm năng là @[Buyer Lead] và tạo bản nháp hỏi về ngân sách cùng khu vực họ muốn$$),
                  ('realtor', 40, 'inbox-zero:realtor:004', $$Label emails from potential sellers as @[Seller Lead] and draft a reply with my calendar link to schedule a home evaluation: https://cal.com/example$$, $$Gắn nhãn email từ người bán tiềm năng là @[Seller Lead] và tạo bản nháp kèm link lịch để hẹn đánh giá nhà: https://cal.com/example$$),
                  ('realtor', 50, 'inbox-zero:realtor:005', $$If someone asks about home prices in a specific area, label as @[Market Inquiry] and draft a reply with recent comparable sales data$$, $$Nếu ai đó hỏi giá nhà ở một khu vực cụ thể, gắn nhãn @[Market Inquiry] và tạo bản nháp kèm dữ liệu giao dịch so sánh gần đây$$),
                  ('realtor', 60, 'inbox-zero:realtor:006', $$Label emails from mortgage brokers and lenders as @[Lender] and archive them$$, $$Gắn nhãn email từ môi giới thế chấp và bên cho vay là @[Lender] rồi lưu trữ chúng$$),
                  ('realtor', 70, 'inbox-zero:realtor:007', $$If someone asks to schedule a showing, label as @[Showing Request] and draft a reply with available time slots$$, $$Nếu ai đó muốn đặt lịch xem nhà, gắn nhãn @[Showing Request] và tạo bản nháp với các khung giờ còn trống$$),
                  ('realtor', 80, 'inbox-zero:realtor:008', $$Label emails about closing documents as @[Closing] and forward to transactions@realty.com$$, $$Gắn nhãn email về hồ sơ chốt giao dịch là @[Closing] và chuyển tiếp tới transactions@realty.com$$),
                  ('realtor', 90, 'inbox-zero:realtor:009', $$If someone asks about the home buying process, draft a reply with our buyer's guide link: https://realty.com/buyers-guide$$, $$Nếu ai đó hỏi quy trình mua nhà, tạo bản nháp trả lời kèm link hướng dẫn người mua: https://realty.com/buyers-guide$$),
                  ('realtor', 100, 'inbox-zero:realtor:010', $$Label emails from home inspectors as @[Inspector] and forward to scheduling@realty.com$$, $$Gắn nhãn email từ thanh tra nhà là @[Inspector] và chuyển tiếp tới scheduling@realty.com$$),
                  ('realtor', 110, 'inbox-zero:realtor:011', $$If someone refers a client to me, label as @[Referral] and draft a thank you reply with my calendar link to schedule a consultation$$, $$Nếu ai đó giới thiệu khách hàng cho tôi, gắn nhãn @[Referral] và tạo bản nháp cảm ơn kèm link lịch để đặt buổi tư vấn$$),

                  ('investor', 10, 'inbox-zero:investor:001', $$Label emails from @mycompany.com addresses as @[Team]$$, $$Gắn nhãn email từ địa chỉ @mycompany.com là @[Team]$$),
                  ('investor', 20, 'inbox-zero:investor:002', $$Label urgent emails as @[Urgent]$$, $$Gắn nhãn email khẩn cấp là @[Urgent]$$),
                  ('investor', 30, 'inbox-zero:investor:003', $$If a founder asks to set up a call, draft a reply with my calendar link: https://cal.com/example$$, $$Nếu một founder muốn đặt lịch gọi, tạo bản nháp trả lời kèm link lịch của tôi: https://cal.com/example$$),
                  ('investor', 40, 'inbox-zero:investor:004', $$If a founder sends me an investor update, label it @[Investor Update] and archive it$$, $$Nếu founder gửi investor update cho tôi, gắn nhãn @[Investor Update] và lưu trữ nó$$),
                  ('investor', 50, 'inbox-zero:investor:005', $$Forward pitch decks to analyst@vc.com that asks them to review it and label them @[Pitch Deck]$$, $$Chuyển tiếp pitch deck tới analyst@vc.com để nhờ họ review và gắn nhãn @[Pitch Deck]$$),
                  ('investor', 60, 'inbox-zero:investor:006', $$Label emails from LPs as @[LP]$$, $$Gắn nhãn email từ LP là @[LP]$$),
                  ('investor', 70, 'inbox-zero:investor:007', $$Label legal documents as @[Legal]$$, $$Gắn nhãn tài liệu pháp lý là @[Legal]$$),
                  ('investor', 80, 'inbox-zero:investor:008', $$Label emails about travel as @[Travel]$$, $$Gắn nhãn email về đi lại là @[Travel]$$),
                  ('investor', 90, 'inbox-zero:investor:009', $$Label emails about portfolio company exits as @[Exit Opportunity]$$, $$Gắn nhãn email về exit của công ty trong danh mục là @[Exit Opportunity]$$),
                  ('investor', 100, 'inbox-zero:investor:010', $$Label emails containing term sheets as @[Term Sheet]$$, $$Gắn nhãn email có term sheet là @[Term Sheet]$$),
                  ('investor', 110, 'inbox-zero:investor:011', $$If a portfolio company reports bad news, label as @[Portfolio Alert] and draft a reply to schedule an emergency call$$, $$Nếu công ty trong danh mục báo tin xấu, gắn nhãn @[Portfolio Alert] và tạo bản nháp để đặt lịch gọi khẩn cấp$$),
                  ('investor', 120, 'inbox-zero:investor:012', $$Label due diligence related emails as @[Due Diligence]$$, $$Gắn nhãn email liên quan thẩm định là @[Due Diligence]$$),
                  ('investor', 130, 'inbox-zero:investor:013', $$Forward emails about industry research reports to research@vc.com$$, $$Chuyển tiếp email về báo cáo nghiên cứu ngành tới research@vc.com$$),
                  ('investor', 140, 'inbox-zero:investor:014', $$If someone asks for a warm intro to a portfolio company, draft a reply asking for more context about why they want to connect$$, $$Nếu ai đó xin giới thiệu ấm tới công ty trong danh mục, tạo bản nháp hỏi thêm bối cảnh vì sao họ muốn kết nối$$),
                  ('investor', 150, 'inbox-zero:investor:015', $$Label emails about fund administration as @[Fund Admin]$$, $$Gắn nhãn email về quản trị quỹ là @[Fund Admin]$$),
                  ('investor', 160, 'inbox-zero:investor:016', $$Label emails about speaking at investment conferences as @[Speaking Opportunity]$$, $$Gắn nhãn email về phát biểu tại hội nghị đầu tư là @[Speaking Opportunity]$$),

                  ('assistant', 10, 'inbox-zero:assistant:001', $$Label emails from @mycompany.com addresses as @[Team]$$, $$Gắn nhãn email từ địa chỉ @mycompany.com là @[Team]$$),
                  ('assistant', 20, 'inbox-zero:assistant:002', $$Label urgent emails as @[Urgent]$$, $$Gắn nhãn email khẩn cấp là @[Urgent]$$),
                  ('assistant', 30, 'inbox-zero:assistant:003', $$If someone asks to set up a call, draft a reply with my calendar link: https://cal.com/example$$, $$Nếu ai đó muốn đặt lịch gọi, tạo bản nháp trả lời kèm link lịch của tôi: https://cal.com/example$$),
                  ('assistant', 40, 'inbox-zero:assistant:004', $$Label emails with feedback from customers about our product as @[Customer Feedback]$$, $$Gắn nhãn email có phản hồi của khách hàng về sản phẩm là @[Customer Feedback]$$),
                  ('assistant', 50, 'inbox-zero:assistant:005', $$Label emails from customers who need our help and support as @[Customer Support]$$, $$Gắn nhãn email từ khách hàng cần trợ giúp và hỗ trợ là @[Customer Support]$$),
                  ('assistant', 60, 'inbox-zero:assistant:006', $$Label emails from investors as @[Investor]$$, $$Gắn nhãn email từ nhà đầu tư là @[Investor]$$),
                  ('assistant', 70, 'inbox-zero:assistant:007', $$Label legal documents as @[Legal]$$, $$Gắn nhãn tài liệu pháp lý là @[Legal]$$),
                  ('assistant', 80, 'inbox-zero:assistant:008', $$Label emails about travel as @[Travel]$$, $$Gắn nhãn email về đi lại là @[Travel]$$),
                  ('assistant', 90, 'inbox-zero:assistant:009', $$Label recruitment related emails as @[Hiring]$$, $$Gắn nhãn email liên quan tuyển dụng là @[Hiring]$$),

                  ('developer', 10, 'inbox-zero:developer:001', $$Label emails from @mycompany.com addresses as @[Team]$$, $$Gắn nhãn email từ địa chỉ @mycompany.com là @[Team]$$),
                  ('developer', 20, 'inbox-zero:developer:002', $$Label urgent emails as @[Urgent]$$, $$Gắn nhãn email khẩn cấp là @[Urgent]$$),
                  ('developer', 30, 'inbox-zero:developer:003', $$Label server errors, deployment failures, and other server alerts as @[Alert] and forward to oncall@company.com$$, $$Gắn nhãn lỗi server, deploy fail và cảnh báo server khác là @[Alert] rồi chuyển tiếp tới oncall@company.com$$),
                  ('developer', 40, 'inbox-zero:developer:004', $$Label emails from GitHub as @[GitHub] and archive them$$, $$Gắn nhãn email từ GitHub là @[GitHub] và lưu trữ chúng$$),
                  ('developer', 50, 'inbox-zero:developer:005', $$Label emails from Figma as @[Design] and archive them$$, $$Gắn nhãn email từ Figma là @[Design] và lưu trữ chúng$$),
                  ('developer', 60, 'inbox-zero:developer:006', $$Label emails from Stripe as @[Stripe] and archive them$$, $$Gắn nhãn email từ Stripe là @[Stripe] và lưu trữ chúng$$),
