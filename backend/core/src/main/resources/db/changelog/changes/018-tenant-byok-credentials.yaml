databaseChangeLog:
  - changeSet:
      id: 018-tenant-byok-credentials
      author: zeromail
      changes:
        - createTable:
            tableName: tenant_byok_credentials
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tenant_byok_credentials_tenant
                    references: tenants(id)
                    deleteCascade: true
              - column:
                  name: provider
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: endpoint
                  type: varchar(512)
              - column:
                  name: encrypted_key
                  type: bytea
                  constraints:
                    nullable: false
              - column:
                  name: key_version
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: tenant_byok_credentials
            columnNames: tenant_id
            constraintName: uq_tenant_byok_credentials_tenant
        - sql:
            comment: Check constraint for the allowed BYOK providers.
            sql: ALTER TABLE tenant_byok_credentials ADD CONSTRAINT ck_tenant_byok_credentials_provider CHECK (provider IN ('anthropic','openai-compatible'))
      rollback:
        - dropTable:
            tableName: tenant_byok_credentials
