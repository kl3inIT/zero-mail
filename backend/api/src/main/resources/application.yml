spring:
  application:
    name: zeromail-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zeromail}
    username: ${DB_USER:zeromail}
    password: ${DB_PASSWORD:zeromail}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  session:
    store-type: redis
    timeout: 30m
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  cloud:
    gcp:
      secretmanager:
        enabled: ${GCP_SECRET_MANAGER_ENABLED:false}
zeromail:
  crypto:
    # Prefer Secret Manager in deployed environments; fall back to local env var in dev/test.
    refresh-token-key-base64: ${REFRESH_TOKEN_KEY_BASE64:${sm://oauth-refresh-token-key-v1/versions/1:}}
server:
  port: 8080
  servlet:
    session:
      cookie:
        name: ZEROMAIL_SESSION
        http-only: true
        secure: false  # dev; true in prod profile
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health, info
