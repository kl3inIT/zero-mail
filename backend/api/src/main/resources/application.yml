spring:
  application:
    name: zeromail-api
  config:
    # Correctness-locked Spring-AI privacy/suppression block lives in backend/core
    # (single source of truth, imported by api + worker). Imported values WIN over this file.
    import: optional:classpath:zero-mail-shared.yml
  # GenAI embedding auto-config exclusion lives on @SpringBootApplication(excludeName=...)
  # in ZeroMailApiApplication (timing-safe; Boot #26858). Do not re-add a yml exclude block.
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      # Opt-in via env var so IntelliJ Run does not trigger Boot's compose
      # lifecycle (which currently tries to build the app image and fails on
      # Windows checkouts where gradlew lacks the executable bit).
      # Bring infra up manually: `docker compose up -d postgres redis`.
      enabled: ${SPRING_DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start_only
      file: ${SPRING_DOCKER_COMPOSE_FILE:docker-compose.yml}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5555/zeromail_dev?sslmode=disable}
    username: ${DB_USER:zeromail_dev}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/gmail.modify
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: zeromail:session
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  ai:
    # spring.ai.model.*=none + chat[.client].observations.log-prompt/completion=false are
    # centralized in zero-mail-shared.yml (imported above). Only api-specific keys remain here.
    openai:
      chat:
        observations:
          include-completion: false
zero-mail:
  session:
    cookie:
      # Default in SecurityConfig is secure=true (prod). Dev runs on http://localhost,
      # so the browser would drop a Secure cookie — override to false locally. Production
      # leaves this unset to inherit the secure default. CR-04.
      # Env var NAME stays ZEROMAIL_SESSION_COOKIE_SECURE — relaxed binding maps it to the kebab key.
      secure: ${ZEROMAIL_SESSION_COOKIE_SECURE:false}
  admin:
    bootstrap-emails: ${ZEROMAIL_ADMIN_BOOTSTRAP_EMAILS:}
    audit:
      hmac-kek-base64: ${ZEROMAIL_ADMIN_AUDIT_HMAC_KEK_BASE64:}
    webauthn:
      # Dev defaults: the admin SPA runs at http://localhost:5174, so the WebAuthn rpId MUST be
      # `localhost` (a registrable suffix of the origin) or the browser rejects every ceremony with
      # "The RP ID ... is invalid for this domain". The prod profile (application-prod.yml) sets the
      # real admin.zeromail.vn values. Env vars override either.
      rp-id: ${ZEROMAIL_ADMIN_WEBAUTHN_RP_ID:localhost}
      rp-name: ${ZEROMAIL_ADMIN_WEBAUTHN_RP_NAME:Zero Mail Admin}
      allowed-origins: ${ZEROMAIL_ADMIN_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:5174}
  api:
    web:
      base-url: ${ZEROMAIL_WEB_BASE_URL:http://localhost:3000}
    cors:
      # JHipster-style dev CORS config for separated frontend/API ports.
      allowed-origins: "${ZEROMAIL_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5174}"
      allowed-origin-patterns: "${ZEROMAIL_CORS_ALLOWED_ORIGIN_PATTERNS:}"
      allowed-methods: "${ZEROMAIL_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}"
      allowed-headers: "${ZEROMAIL_CORS_ALLOWED_HEADERS:*}"
      exposed-headers: "${ZEROMAIL_CORS_EXPOSED_HEADERS:XSRF-TOKEN}"
      allow-credentials: ${ZEROMAIL_CORS_ALLOW_CREDENTIALS:true}
      max-age: ${ZEROMAIL_CORS_MAX_AGE:1800}
    gmail:
      pubsub:
        push-audience-url: ${PUBSUB_PUSH_AUDIENCE_URL:?PUBSUB_PUSH_AUDIENCE_URL env var is required}
        sa-principal-email: ${PUBSUB_SA_PRINCIPAL_EMAIL:?PUBSUB_SA_PRINCIPAL_EMAIL env var is required}
        oidc-certificates-url: ${PUBSUB_OIDC_CERTIFICATES_URL:https://www.googleapis.com/oauth2/v3/certs}
  messaging:
    telegram:
      enabled: ${ZERO_MAIL_MESSAGING_TELEGRAM_ENABLED:false}
      bot-token: ${ZERO_MAIL_MESSAGING_TELEGRAM_BOT_TOKEN:${TELEGRAM_BOT_TOKEN:}}
      bot-username: ${ZERO_MAIL_MESSAGING_TELEGRAM_BOT_USERNAME:}
      bot-account-id: ${ZERO_MAIL_MESSAGING_TELEGRAM_BOT_ACCOUNT_ID:}
      webhook-secret-token: ${ZERO_MAIL_MESSAGING_TELEGRAM_WEBHOOK_SECRET_TOKEN:${TELEGRAM_WEBHOOK_SECRET:}}
      messaging-link-secret: ${ZERO_MAIL_MESSAGING_TELEGRAM_MESSAGING_LINK_SECRET:${TELEGRAM_MESSAGING_LINK_SECRET:}}
      api-base-url: ${ZERO_MAIL_MESSAGING_TELEGRAM_API_BASE_URL:https://api.telegram.org}
  crypto:
    # Required deployment secret. For local dev, set REFRESH_TOKEN_KEY_BASE64 in .env or
    # docker-compose.yml environment block. For openapi-emit, build.gradle.kts supplies a dummy.
    # Boot fails immediately with a clear error if this env var is absent.
    # No GCP Secret Manager fallback — CLAUDE.md stack lock: secrets via Docker secret,
    # systemd credential, or locked-down env file on the VPS.
    refresh-token-key-base64: ${REFRESH_TOKEN_KEY_BASE64:?REFRESH_TOKEN_KEY_BASE64 must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
    # Separate AES-256 KEK for the Gmail inbox projection (subject / snippet / sender email +
    # display name). Distinct from refresh-token-key-base64 to keep OAuth refresh tokens and
    # mail metadata in different blast-radius compartments.
    inbox-projection-key-base64: ${INBOX_PROJECTION_KEY_BASE64:?INBOX_PROJECTION_KEY_BASE64 must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
    # Separate HMAC-SHA256 key used to derive the deterministic sender_email_hash column on the
    # inbox projection. Separate from inbox-projection-key-base64 so a leak of the field
    # encryption key cannot be used to recompute sender hashes (and vice versa).
    inbox-projection-sender-hash-key-base64: ${INBOX_PROJECTION_SENDER_HASH_KEY_BASE64:?INBOX_PROJECTION_SENDER_HASH_KEY_BASE64 must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
  billing:
    lemon-squeezy:
      # Optional in dev/test (record is fully-nullable). Required in prod for
      # Required by checkout creation and the webhook controller to verify HMAC.
      # apiKey + webhookSigningSecret are secrets — supply via
      # Docker secret / systemd credential / .env.local, never commit.
      store-id: ${LEMON_SQUEEZY_STORE_ID:}
      store-slug: ${LEMON_SQUEEZY_STORE_SLUG:}
      api-key: ${LEMON_SQUEEZY_API_KEY:}
      webhook-signing-secret: ${LEMON_SQUEEZY_WEBHOOK_SIGNING_SECRET:${LEMON_SQUEEZY_WEBHOOK_SECRET:}}
      test-mode: ${LEMON_SQUEEZY_TEST_MODE:false}
      api-base-url: ${LEMON_SQUEEZY_API_BASE_URL:https://api.lemonsqueezy.com/v1}
      checkout-reuse-window: ${LEMON_SQUEEZY_CHECKOUT_REUSE_WINDOW:PT15M}
    sepay:
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
      bank-code: ${SEPAY_BANK_CODE:}
      bank-name: ${SEPAY_BANK_NAME:}
      account-number: ${SEPAY_ACCOUNT_NUMBER:}
      account-name: ${SEPAY_ACCOUNT_NAME:}
      qr-base-url: ${SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
      intent-reuse-window: ${SEPAY_INTENT_REUSE_WINDOW:PT15M}
  llm:
    platform:
      # provider/base-url/models/timeouts default in LlmProperties; only api-key is deployment-supplied
      api-key: ${ZEROMAIL_LLM_PLATFORM_API_KEY:?ZEROMAIL_LLM_PLATFORM_API_KEY must be supplied via deployment secret source (Docker secret, systemd credential, or locked-down env file)}
    byok:
      allow-non-vendor-endpoints: false
      allowed-extra-hosts: []
      connect-timeout: 5s
      read-timeout: 15s
  chat:
    heartbeat-interval-seconds: 15
    sse-timeout-minutes: 30
    default-model: openai/gpt-5.4-nano
    # MEDIUM-7: token budget enforcement per AI-SPEC section 4b.
    max-history-tokens: 24576
    max-tool-output-tokens: 4000
    history:
      page-size: 50
    # MEDIUM-8: reverse-proxy timeout doc note.
    # NGINX site config for the /api/chat location MUST set: proxy_read_timeout 31m;
    # The 30-minute SseEmitter timeout above plus 1 min headroom prevents nginx
    # from severing the SSE connection mid-stream.
server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ZEROMAIL_SESSION
        http-only: true
        secure: false  # dev; true in prod profile
        same-site: lax
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.zeromail.api.controllers
management:
  # micrometer-registry-otlp is on the classpath; without this it auto-pushes metrics to the
  # default http://localhost:4318 (nothing listens there) on every profile, flooding WARN logs —
  # including tests. Metrics are collected via Prometheus scrape of /actuator/prometheus; traces
  # still export over OTLP to Alloy (prod). Disable the redundant OTLP metrics push everywhere.
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    enable:
      all: true
