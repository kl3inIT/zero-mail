# Activated by SPRING_PROFILES_ACTIVE=e2e-stub. Used by Playwright launch-golden-path.spec.ts only.
# HIGH-4: self-sufficient. Every override below is a literal placeholder.
zero-mail:
  e2e-stub:
    enabled: true
  crypto:
    refresh-token-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  api:
    gmail:
      pubsub:
        push-audience-url: https://e2e-stub.invalid/internal/pubsub/gmail
        sa-principal-email: e2e-stub-sa@e2e-stub.invalid
        oidc-certificates-url: https://www.googleapis.com/oauth2/v3/certs
  llm:
    platform:
      api-key: e2e-stub-llm-key
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: e2e-stub-client-id
            client-secret: e2e-stub-client-secret
  ai:
    openai:
      api-key: e2e-stub-openai-key
    anthropic:
      api-key: e2e-stub-anthropic-key
