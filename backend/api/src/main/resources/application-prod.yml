# Production profile: structured INFO logs, minimal actuator surface, secure cookies.
# Privacy invariants enforced: prompt/completion logging OFF (defense-in-depth — also
# enforced by base application.yml).

logging:
  level:
    root: INFO
    com.zeromail: INFO
    com.zeromail.core.chat: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN

spring:
  # Compose lifecycle always operator-driven on the VPS.
  docker:
    compose:
      enabled: false

  datasource:
    hikari:
      pool-name: zeromail-api-pool
      maximum-pool-size: ${ZERO_MAIL_API_DB_POOL_MAX:16}
      minimum-idle: ${ZERO_MAIL_API_DB_POOL_MIN_IDLE:4}
      connection-timeout: ${ZERO_MAIL_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${ZERO_MAIL_DB_VALIDATION_TIMEOUT_MS:1000}
      keepalive-time: ${ZERO_MAIL_DB_KEEPALIVE_TIME_MS:120000}
      max-lifetime: ${ZERO_MAIL_DB_MAX_LIFETIME_MS:600000}
      leak-detection-threshold: ${ZERO_MAIL_DB_LEAK_DETECTION_THRESHOLD_MS:0}

  lifecycle:
    timeout-per-shutdown-phase: ${ZERO_MAIL_SHUTDOWN_PHASE_TIMEOUT:25s}

  ai:
    chat:
      # intentional defense-in-depth: also enforced by base + zero-mail-shared.yml — never drop
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
    openai:
      chat:
        observations:
          include-completion: false

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        # CASA V3.4.1 — explicit Secure flag in prod; fail-loud startup guard in
        # ProdSessionCookieSecureGuard rejects any prod boot where this is false.
        secure: true

# Actuator surface: only health + prometheus exposed. Prometheus is scrape-only over
# the internal docker network; nginx-proxy-manager does not route /actuator/** publicly.
# Health details hidden — readiness/liveness probes still return 200/503.
management:
  observations:
    enabled: true
  tracing:
    enabled: ${ZERO_MAIL_TRACING_ENABLED:true}
    sampling:
      probability: ${ZERO_MAIL_TRACE_SAMPLING_PROBABILITY:0.10}
    export:
      otlp:
        enabled: ${ZERO_MAIL_OTLP_TRACING_ENABLED:true}
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      service.namespace: zeromail
      service.version: ${ZERO_MAIL_RELEASE_VERSION:unknown}
      deployment.environment.name: ${ZERO_MAIL_DEPLOYMENT_ENVIRONMENT:production}
    tracing:
      export:
        otlp:
          endpoint: ${ZERO_MAIL_OTLP_TRACES_ENDPOINT:http://zeromail-alloy:4318/v1/traces}
          transport: http
          compression: gzip
          connect-timeout: ${ZERO_MAIL_OTLP_CONNECT_TIMEOUT:2s}
          timeout: ${ZERO_MAIL_OTLP_TIMEOUT:10s}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Disable Swagger UI in production to reduce info disclosure. The OpenAPI JSON endpoint
# stays available for the build-time openapi-emit task and for admin tooling proxied
# internally; nginx-proxy-manager does not route /v3/api-docs publicly.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
