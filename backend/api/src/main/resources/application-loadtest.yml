# Activated by SPRING_PROFILES_ACTIVE=loadtest. Used by loadtest/compose.loadtest.yml only. See D-02/D-03.
zero-mail:
  loadtest:
    enabled: true
  crypto:
    refresh-token-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    inbox-projection-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    inbox-projection-sender-hash-key-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  api:
    gmail:
      pubsub:
        push-audience-url: https://loadtest.invalid/internal/pubsub/gmail
        sa-principal-email: loadtest-sa@loadtest.invalid
        oidc-certificates-url: https://www.googleapis.com/oauth2/v3/certs
  llm:
    platform:
      api-key: loadtest-llm-key
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: loadtest-client-id
            client-secret: loadtest-client-secret
  ai:
    model:
      chat: none
