services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: zeromail
      POSTGRES_USER: zeromail
      POSTGRES_PASSWORD: zeromail
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeromail -d zeromail"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.6.3
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
