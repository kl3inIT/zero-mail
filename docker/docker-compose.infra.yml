# Zero Mail — infrastructure services (redis).
#
# PostgreSQL is NOT here anymore: it was extracted to /apps/postgres as a
# standalone shared service (zero-mail and northstar are both just clients).
# See /apps/postgres/docker-compose.yml. Start it separately.
#
# Run together with the application stack:
#   docker compose \
#     -f docker/docker-compose.infra.yml \
#     -f docker/docker-compose.yml \
#     --env-file .env up -d
#
# Volumes are pinned to their existing names so data survives any compose-file
# relocation or project rename. Project name pinned to `zero-mail` to match.
name: zero-mail

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  redis:
    image: ${REDIS_IMAGE:-redis:8.6.3}
    container_name: zeromail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    networks:
      - zeromail-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

# NOTE: nginx-proxy-manager is intentionally NOT defined here. It runs as a
# separate standalone container/project that owns the live SSL certs + proxy
# host routing. It only needs to share the `zeromail-proxy` network to reach
# zeromail-frontend / zeromail-admin / zeromail-api. Attach it once with:
#   docker network connect zeromail-proxy nginx-proxy-manager
# (or add `zeromail-proxy` as an external network in its own compose file so the
#  attachment survives NPM recreation).

networks:
  zeromail-proxy:
    external: true
  zeromail-internal:
    external: true

volumes:
  redis_data:
    name: ${REDIS_VOLUME_NAME:-zero-mail_redis_data}
