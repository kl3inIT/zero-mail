# Gitleaks configuration extending the default ruleset.
# Run locally: gitleaks detect --config .gitleaks.toml --no-banner --redact
#
# Strategy:
#   - inherit the upstream default ruleset (avoids re-listing every secret pattern)
#   - allowlist known-safe paths: loadtest fixtures, ci scripts, env.example, etc.

title = "Zero Mail Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for known-non-secret content"

paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)\.env\.dev\.example$''',
    '''(^|/)\.gitleaks\.toml$''',
    '''(^|/)loadtest/scripts/.*''',
    '''(^|/)loadtest/compose\.loadtest\.yml$''',
    '''(^|/)apps/web/i18n/messages/.*''',
    '''(^|/)apps/web/__tests__/.*''',
    '''(^|/)backend/.*/src/test/.*''',
    '''(^|/)docs/.*''',
    '''(^|/)\.planning/.*''',
    '''(^|/)scripts/needs-reply-mockup\.html$''',
]

regexes = [
    # Test/fixture placeholders for AES-256 keys (32 zero bytes).
    '''AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=''',
    # Loadtest hardcoded "loadtest" credentials and dummy API keys.
    '''test-(openai|anthropic|google|deepseek|sepay|resend|platform|webhook)-key''',
    '''(client_id|client_secret|api_key)\s*[:=]\s*loadtest''',
    # Documented sample SHA / OAuth client ID shapes in runbooks.
    '''<vps-ip>''',
    '''<32hex>''',
]

# Per-rule overrides — JWT pattern is noisy for our test fixtures and OpenAPI examples.
[[allowlist.commits]]
# Reserve this stanza for commits where a secret leak was already remediated by rotation;
# add the commit SHA here so re-scanning history does not re-flag the rotated value.
