packages:
  - apps/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  msgpackr-extract: false
  msw: false
  sharp: false
  unrs-resolver: false

# pnpm 11 reads overrides + peerDependencyRules from pnpm-workspace.yaml (was
# package.json#pnpm in v10). https://pnpm.io/settings
peerDependencyRules:
  ignoreMissing:
    - '@playwright/test'

# CASA Tier 2 dependency CVE remediations — force transitives above patched versions.
overrides:
  postcss: '>=8.5.10' # GHSA-qx2v-qp2m-jg93 (medium 6.1)
  ip-address: '>=10.1.1' # GHSA-v2v4-37r5-5v8g (medium 5.3)
  '@babel/core': '>=7.29.6'
  '@opentelemetry/core': '>=2.8.0'
  dompurify: '>=3.4.9'
  esbuild: '>=0.28.1'
  js-yaml: '>=4.2.0'
