# Project-scoped Codex config for zero-mail.
# Loaded only when this project is marked trusted in ~/.codex/config.toml.
# See: https://github.com/openai/codex/blob/main/docs/config.md

[mcp_servers.postgres]
command = "powershell.exe"
args = [
  "-NoProfile",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "scripts/mcp/postgres-mcp.ps1",
]