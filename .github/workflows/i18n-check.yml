name: i18n key coverage

on:
  pull_request:
    paths:
      - 'apps/web/i18n/messages/**'
      - 'apps/web/i18n/components/**'
      - 'apps/web/app/**'
      - 'apps/web/components/**'
      - 'apps/web/features/**'
      - 'apps/web/scripts/check-i18n.ts'
      - 'backend/api/src/main/java/com/zeromail/api/error/ErrorCodes.java'
      - 'tools/i18n-key-coverage/**'
      - '.github/workflows/i18n-check.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: i18n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-key-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run i18n key coverage gate
        run: node tools/i18n-key-coverage/index.mjs
