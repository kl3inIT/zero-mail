# Aggregated security scanning: SAST (CodeQL), secrets (Gitleaks), dependency CVE
# (OSV-Scanner against generated SBOMs), filesystem scan (Trivy), and container
# image scan (Trivy). PRs build local images for scanning; push:main scans the
# published GHCR images so the Security tab receives the same SARIF categories
# before and after merge.
#
# Runs on:
#   - every PR + push to main (fast jobs)
#   - weekly schedule (Monday 03:00 UTC) — keeps CVE feeds fresh
#   - manual dispatch
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

concurrency:
  # Cancel superseded PR runs only. For push:main and the weekly cron, let
  # in-progress runs finish — otherwise a scheduled run that lands on top of
  # a push will cancel its CodeQL upload and leave a stale "unsuccessful
  # execution" SARIF that GitHub surfaces as a Code scanning configuration error.
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true

      - name: Set up Gradle
        if: ${{ matrix.language == 'java-kotlin' }}
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build backend (manual mode)
        if: ${{ matrix.language == 'java-kotlin' }}
        run: ./gradlew --no-daemon classes -x test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE only required for org-wide scanning; per-repo OSS use is free.
          # v2.3.9 still bundles Node.js 20; runners force Node 24 from 2026-06-02.
          # Opt in now so the deprecation warning clears and we surface any Node 24
          # incompatibility before the forced cutover. Drop this when gitleaks
          # publishes a Node 24 release.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          # CRITICAL only — HIGH transitive deps are too noisy for a 3-person
          # team without a dedicated remediation rotation. CVEs still surface in
          # the SARIF upload to Security tab; the gate just doesn't block.
          severity: CRITICAL
          format: sarif
          output: trivy-fs.sarif
          # Report-only — surface findings to the Security tab via SARIF upload
          # but do not block CI. A 3-person team triages issues from the Security
          # dashboard, not from a red CI light.
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  sbom-and-osv:
    name: SBOM + OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Generate backend SBOM (CycloneDX)
        run: ./gradlew --no-daemon cyclonedxBom -PsbomReason=ci || true

      # Frontend SBOM via cyclonedx-npm is incompatible with pnpm workspaces
      # (it runs `npm ls` internally which doesn't recognise the workspace layout).
      # OSV-Scanner reads pnpm-lock.yaml directly below — no separate SBOM needed
      # to gate vulnerabilities. Switch to @cyclonedx/cdxgen if a CycloneDX file
      # ever becomes a hard requirement.

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          # OSV-Scanner v2 dropped --skip-git (it never scans history anyway).
          # `--recursive ./` walks pnpm-lock.yaml + Gradle build files in one pass.
          scan-args: |-
            --recursive
            ./

      - name: Upload backend SBOM artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          # cyclonedxBom plugin is applied at the root project (see
          # build.gradle.kts), so it emits a single aggregated BOM at
          # ./build/reports/ — not under each backend/* module. The old
          # backend/**/build/reports/ path matched nothing and triggered a
          # "no files found" warning on every run.
          path: |
            build/reports/bom*.json
            build/reports/bom*.xml
          retention-days: 30
          if-no-files-found: warn

  trivy-image:
    name: Trivy image scan
    needs: []
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: backend/api/Dockerfile
            image: ghcr.io/kl3init/zero-mail-api
            build-args: ''
          - component: worker
            dockerfile: backend/worker/Dockerfile
            image: ghcr.io/kl3init/zero-mail-worker
            build-args: ''
          - component: frontend
            dockerfile: apps/web/Dockerfile
            image: ghcr.io/kl3init/zero-mail-frontend
            build-args: |
              NEXT_PUBLIC_API_BASE=https://zeromail.vn
          - component: admin
            dockerfile: apps/admin/Dockerfile
            image: ghcr.io/kl3init/zero-mail-admin
            build-args: |
              VITE_ADMIN_API_BASE=https://admin.zeromail.vn
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        shell: bash
        run: |
          SHORT="${GITHUB_SHA:0:7}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "mode=local" >> "$GITHUB_OUTPUT"
            echo "ref=zeromail-${{ matrix.component }}:trivy-${SHORT}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=published" >> "$GITHUB_OUTPUT"
            echo "ref=${{ matrix.image }}:sha-${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PR image for Trivy
        if: ${{ steps.image.outputs.mode == 'local' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          pull: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=trivy-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=trivy-${{ matrix.component }}
          provenance: false

      - name: Wait for image to exist
        if: ${{ steps.image.outputs.mode == 'published' }}
        run: |
          IMG="${{ steps.image.outputs.ref }}"
          for attempt in {1..20}; do
            if docker manifest inspect "$IMG" >/dev/null 2>&1; then
              echo "image ready"; exit 0
            fi
            sleep 15
          done
          echo "::warning::$IMG not found after 5min — skipping scan"
          exit 0

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          ignore-unfixed: true
          severity: CRITICAL
          format: sarif
          output: trivy-image-${{ matrix.component }}.sarif
          # Report-only (same rationale as trivy-fs above).
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.component }}.sarif
          category: trivy-image-${{ matrix.component }}
