# Production deploy.
#
# Manually dispatched (workflow_dispatch) with a version tag input, gated by the
# `prod` GitHub Environment. The deploy job runs on the self-hosted runner ON the
# VPS (no inbound SSH — see the `deploy` job for why).
#
# Pre-conditions checked in `verify-gates`:
#   1. The version input matches v<major>.<minor>.<patch> and the tag exists on origin.
#   2. Build and Push Images workflow published :prod tag images for this version.
name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to deploy (e.g. v1.2.3). Must already have :prod images published.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify-gates:
    name: Verify release gates passed for tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Validate input shape
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.version }}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' must match v<major>.<minor>.<patch> (no -rc suffix)"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Confirm tag exists on origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.check.outputs.tag }}" --jq '.object.sha' \
            || { echo "::error::Tag ${{ steps.check.outputs.tag }} not found on origin"; exit 1; }

      - name: Confirm Build and Push succeeded for tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --repo is required because this job runs without a checkout (gh run list
          # otherwise tries to inspect the cwd as a git repository).
          # Tag pushes created by GITHUB_TOKEN do not trigger push workflows, so
          # Deploy Latest Main dispatches the image build manually on the tag ref.
          read -r status conclusion event url < <(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "Build and Push Images" \
            --branch "${{ steps.check.outputs.tag }}" \
            --limit 20 \
            --json status,conclusion,event,url \
            --jq '([.[] | select(.event == "push" or .event == "workflow_dispatch")][0] // {status:"missing",conclusion:"",event:"",url:""}) | [.status, (.conclusion // ""), (.event // ""), (.url // "")] | @tsv')
          if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
            echo "::error::Build and Push for tag ${{ steps.check.outputs.tag }} did not complete successfully (status=${status}, conclusion=${conclusion}, event=${event}, url=${url})"
            exit 1
          fi

  deploy:
    name: Deploy prod (self-hosted VPS runner)
    needs: verify-gates
    # Runs on a self-hosted runner ON the prod VPS, so the deploy is a local process on the box —
    # there is no inbound SSH from rotating GitHub-hosted runner IPs for Hostinger's edge DDoS
    # filter to intermittently drop. That filtering (by source IP / country, automated, no
    # whitelist) was the confirmed cause of the "dial tcp i/o timeout" on appleboy/ssh-action — it
    # is network-side, not the action (v1.0.0 timed out too). Only this workflow_dispatch +
    # prod-environment-gated job targets [self-hosted, prod]; every PR-triggered workflow
    # (ci/security/react-doctor/i18n) stays on GitHub-hosted runners so fork PRs never reach it.
    runs-on: [self-hosted, prod]
    environment:
      name: prod
      url: https://zeromail.vn
    timeout-minutes: 20

    steps:
      - name: Deploy prod stack
        env:
          DEPLOY_TAG: ${{ needs.verify-gates.outputs.tag }}
        run: |
          set -euo pipefail
          cd /apps/zero-mail
          git fetch --quiet --force origin "refs/tags/${DEPLOY_TAG}":"refs/tags/${DEPLOY_TAG}"
          git checkout --quiet "${DEPLOY_TAG}" -- docker/docker-compose.yml
          # Snapshot the CURRENTLY-running image IDs before recreate. This is the source
          # of truth for the "Roll back to previous images on failure" step below.
          echo "::group::Snapshot previous image digests for rollback"
          docker inspect --format='zeromail-api {{index .Image}}' zeromail-api 2>/dev/null | tee /apps/zero-mail/.last-deploy.txt || true
          docker inspect --format='zeromail-worker {{index .Image}}' zeromail-worker 2>/dev/null | tee -a /apps/zero-mail/.last-deploy.txt || true
          docker inspect --format='zeromail-frontend {{index .Image}}' zeromail-frontend 2>/dev/null | tee -a /apps/zero-mail/.last-deploy.txt || true
          docker inspect --format='zeromail-admin {{index .Image}}' zeromail-admin 2>/dev/null | tee -a /apps/zero-mail/.last-deploy.txt || true
          echo "::endgroup::"
          echo "::group::Pull versioned images"
          ZEROMAIL_API_IMAGE="ghcr.io/kl3init/zero-mail-api:${DEPLOY_TAG}" \
          ZEROMAIL_WORKER_IMAGE="ghcr.io/kl3init/zero-mail-worker:${DEPLOY_TAG}" \
          ZEROMAIL_FRONTEND_IMAGE="ghcr.io/kl3init/zero-mail-frontend:${DEPLOY_TAG}" \
          ZEROMAIL_ADMIN_IMAGE="ghcr.io/kl3init/zero-mail-admin:${DEPLOY_TAG}" \
            docker compose -f docker/docker-compose.yml pull api worker frontend admin
          echo "::endgroup::"
          echo "::group::Recreate prod containers"
          ZEROMAIL_API_IMAGE="ghcr.io/kl3init/zero-mail-api:${DEPLOY_TAG}" \
          ZEROMAIL_WORKER_IMAGE="ghcr.io/kl3init/zero-mail-worker:${DEPLOY_TAG}" \
          ZEROMAIL_FRONTEND_IMAGE="ghcr.io/kl3init/zero-mail-frontend:${DEPLOY_TAG}" \
          ZEROMAIL_ADMIN_IMAGE="ghcr.io/kl3init/zero-mail-admin:${DEPLOY_TAG}" \
            docker compose -f docker/docker-compose.yml up -d --no-build api worker frontend admin
          echo "::endgroup::"
          echo "::group::Wait for prod readiness"
          for attempt in {1..60}; do
            if docker exec zeromail-api curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "api ready"
              break
            fi
            if [[ $attempt -eq 60 ]]; then
              echo "::error::api failed readiness within 120s"
              docker compose -f docker/docker-compose.yml logs --tail=200 api worker admin
              exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"
          echo "::group::Reload edge proxy so it re-resolves the new api container IP"
          # nginx-proxy-manager (the host :443 edge proxy) pins the api upstream IP at config
          # load for its literal `proxy_pass http://zeromail-api:8080` locations (/api, /oauth2,
          # /login/oauth2, /internal/pubsub). Recreating api above gives it a NEW docker IP, so
          # without this reload every /api + Google-login + Pub/Sub request 502s while / (frontend)
          # stays 200 — exactly the 2026-06-16 login outage. Best-effort here; the /api smoke
          # check below is the real gate.
          docker exec nginx-proxy-manager nginx -s reload \
            && echo "edge proxy reloaded" \
            || echo "::warning::nginx-proxy-manager reload failed — /api may 502 until reloaded manually"
          echo "::endgroup::"

      - name: Post-deploy smoke check
        run: |
          # Two probes: the public frontend root (SSL + NPM + Next.js boot) AND an /api path —
          # because /api is proxied to the api container by a literal upstream that 502s when the
          # edge proxy holds a stale api IP, and a frontend-only probe misses that (/ stays 200).
          # /api/actuator/health is Spring-Security-protected, so 401 = the proxy reached a healthy
          # api; 502/000 = the edge proxy cannot reach api.
          smoke_ok() {
            local root api
            root=$(curl -o /dev/null -s -w '%{http_code}' https://zeromail.vn/ || echo 000)
            api=$(curl -o /dev/null -s -w '%{http_code}' https://zeromail.vn/api/actuator/health || echo 000)
            echo "root=${root} api=${api}"
            [[ "$root" == "200" && "$api" != "502" && "$api" != "000" ]]
          }
          for attempt in {1..20}; do
            if smoke_ok; then echo "prod smoke OK"; exit 0; fi
            sleep 5
          done
          echo "::error::prod smoke check failed (frontend not 200, or /api still 502) within 100s"
          exit 1

      - name: Roll back to previous images on failure
        # Fires when EITHER the deploy step or the smoke check above failed, so a bad
        # release auto-reverts to the previous images instead of leaving prod down
        # half-deployed (the 2026-06-16 v1.3.0 incident: a Liquibase migration HALT left
        # the worker crash-looping and api stuck "Created", prod API down for >1h).
        #
        # Source of truth = .last-deploy.txt, written by the deploy step BEFORE recreate,
        # holding the previous local image IDs (sha256:...) per service. Those image layers
        # are still present on the box (deploy never prunes), so compose can recreate from
        # them without a registry pull.
        #
        # CAVEAT (intentionally surfaced, not hidden): if the failed deploy PARTIALLY applied
        # a forward-only schema migration, the previous app images may not satisfy the new
        # schema and readiness will not come back — this step then exits non-zero with a loud
        # "manual intervention required" so a human fixes the DB. For the common case (migration
        # fails on its first changeset, nothing applied; or app boot/smoke failure) the rollback
        # restores service cleanly.
        if: failure()
        run: |
          set -uo pipefail
          cd /apps/zero-mail
          if [[ ! -s .last-deploy.txt ]]; then
            echo "::error::No .last-deploy.txt snapshot of the previous release — cannot auto-roll back. Manual intervention required."
            exit 1
          fi
          previous_api=$(awk '/^zeromail-api /{print $2}' .last-deploy.txt)
          previous_worker=$(awk '/^zeromail-worker /{print $2}' .last-deploy.txt)
          previous_frontend=$(awk '/^zeromail-frontend /{print $2}' .last-deploy.txt)
          previous_admin=$(awk '/^zeromail-admin /{print $2}' .last-deploy.txt)
          if [[ -z "${previous_api}${previous_worker}${previous_frontend}${previous_admin}" ]]; then
            echo "::error::.last-deploy.txt present but holds no image IDs — manual intervention required."
            exit 1
          fi
          echo "::warning::Deploy failed — rolling back to previous images (api=${previous_api} worker=${previous_worker} frontend=${previous_frontend} admin=${previous_admin})"
          ZEROMAIL_API_IMAGE="${previous_api}" \
          ZEROMAIL_WORKER_IMAGE="${previous_worker}" \
          ZEROMAIL_FRONTEND_IMAGE="${previous_frontend}" \
          ZEROMAIL_ADMIN_IMAGE="${previous_admin}" \
            docker compose -f docker/docker-compose.yml up -d --no-build api worker frontend admin
          # Rolled-back api is a freshly recreated container with a new IP — reload the edge proxy
          # too, or /api + login would 502 even though the rollback itself succeeded.
          docker exec nginx-proxy-manager nginx -s reload >/dev/null 2>&1 \
            && echo "edge proxy reloaded for the rolled-back api IP" \
            || echo "::warning::nginx reload after rollback failed — /api may 502 until reloaded"
          for attempt in {1..60}; do
            if docker exec zeromail-api curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              echo "✓ rollback healthy — prod restored to the previous release (this run stays RED so the failed deploy is investigated)"
              exit 0
            fi
            if [[ $attempt -eq 60 ]]; then
              echo "::error::rollback did not reach api readiness within 120s — manual intervention required (possible partially-applied migration)."
              docker compose -f docker/docker-compose.yml logs --tail=200 api worker
              exit 1
            fi
            sleep 2
          done
